name: Release
# Two entry points:
# - Run workflow (workflow_dispatch) with a version: tests, rolls the CHANGELOG's Unreleased section
#   into that version, commits, tags v<version>, pushes, creates the GitHub Release, and moves v<MAJOR>.
# - Pushing a vX.Y.Z tag by hand: tests the tagged commit, creates the release from the CHANGELOG
#   section already at that commit, and moves v<MAJOR>. The CHANGELOG is not edited.
# The dispatch path pushes its tag with GITHUB_TOKEN, and GitHub does not start workflow runs for
# events caused by GITHUB_TOKEN, so it never re-triggers the tag path.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, for example 1.0.0 (or 1.1.0-rc.1)
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease (does not move the major tag)
        type: boolean
        default: false
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            version="$INPUT_VERSION" prerelease="$INPUT_PRERELEASE"
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::Run the release from $DEFAULT_BRANCH, not $GITHUB_REF"; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::Tag v$version already exists"; exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}" prerelease=false
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH"; exit 1
            fi
          fi
          # Strict semver 2.0.0 (https://semver.org), without build metadata.
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$version" =~ ^$core(-$ident(\.$ident)*)?$ ]]; then
            echo "::error::'$version' is not a semver version like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "major=${version%%.*}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s test -v
      - name: Smoke-render a 1,000-star fixture
        run: python examples/generate.py --stars 1000 --output "$RUNNER_TEMP/smoke.gif"
      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Roll CHANGELOG, commit, tag, and push
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python .github/scripts/changelog.py roll "$VERSION" "$(date -u +%F)" "$RUNNER_TEMP/notes.md"
          git add CHANGELOG.md
          git commit --quiet -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/v$VERSION"
      - name: Read release notes from CHANGELOG
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python .github/scripts/changelog.py notes "$VERSION" "$RUNNER_TEMP/notes.md"
      - name: Create GitHub Release
        env:
          # RELEASE_TOKEN is optional: a personal access token (Contents: write) from a maintainer
          # with two-factor authentication. Marketplace listing needs a person with 2FA; releases made
          # by GITHUB_TOKEN (an app token) have to be published to Marketplace from the web UI.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
      - name: Move major tag
        if: steps.version.outputs.prerelease != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          # Only move v<MAJOR> forward: a hand-pushed patch to an older minor must not rewind it.
          newest=$(git tag -l "v$MAJOR.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" != "v$VERSION" ]; then
            echo "v$MAJOR stays put: $newest is newer than v$VERSION"; exit 0
          fi
          git tag -fa "v$MAJOR" -m "v$MAJOR -> v$VERSION" "v$VERSION^{commit}"
          git push --force origin "refs/tags/v$MAJOR"
