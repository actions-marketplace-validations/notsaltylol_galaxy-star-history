name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s test -v
      - name: Render a million-star fixture
        run: python examples/generate.py --stars 1000000 --output /tmp/million.gif
      - uses: actions/upload-artifact@v4
        with:
          name: million-star-benchmark
          path: /tmp/million.*
          retention-days: 7
